<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Physics Playground</title>
    <style>
      :root {
        --bg: #0f172a;
        --panel: rgba(15, 23, 42, 0.7);
        --text: #e2e8f0;
        --accent: #38bdf8;
      }

      * {
        box-sizing: border-box;
      }

      html, body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: var(--bg);
        color: var(--text);
        font-family: Arial, Helvetica, sans-serif;
      }

      #app {
        position: relative;
        width: 100vw;
        height: 100vh;
      }

      .hud {
        position: absolute;
        top: 16px;
        left: 16px;
        z-index: 10;
        padding: 10px 14px;
        border-radius: 10px;
        background: var(--panel);
        border: 1px solid rgba(148, 163, 184, 0.3);
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
        font-size: 14px;
        letter-spacing: 0.02em;
      }

      .hud strong {
        color: var(--accent);
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div class="hud">
        <strong>Physics Playground</strong><br />
        Click anywhere to spawn a ball.
      </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
    <script src="game.js"></script>
  </body>
</html>
